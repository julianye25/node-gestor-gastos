<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear cuenta · Gestor de Gastos</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="panel auth-card">
        <div class="brand auth-brand">
          <span class="brand-icon" aria-hidden="true">$</span>
          <div>
            <h1>Gestor de Gastos<span class="title-cursor" aria-hidden="true"></span></h1>
            <p class="subtitle">Nueva cuenta</p>
          </div>
        </div>

        <p class="auth-lede">
          Necesitas el código de invitación para crear tu cuenta. Tus gastos serán privados.
        </p>

        <p class="auth-note" id="demo-note" hidden></p>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="invite-code">Código de invitación</label>
            <input
              id="invite-code"
              name="inviteCode"
              type="text"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              required
            />
          </div>

          <div class="field">
            <label for="username">Usuario</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              minlength="3"
              maxlength="20"
              required
            />
            <p class="field-hint">Entre 3 y 20 caracteres: letras, números, puntos, guiones o guiones bajos.</p>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <p class="field-hint">Mínimo 8 caracteres.</p>
          </div>

          <div class="field">
            <label for="confirm-password">Repite la contraseña</label>
            <input
              id="confirm-password"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <p class="auth-error" id="auth-error" role="alert" hidden></p>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary" id="register-btn">Crear cuenta</button>
          </div>
        </form>

        <p class="auth-links">
          ¿Ya tienes cuenta? <a href="/login.html">Entrar</a>
        </p>
      </section>
    </main>

    <script type="module" src="/register.js"></script>
  </body>
</html>
