    <rect x="1" y="1" width="62" height="62" rx="3" fill="none" stroke="#00e5ff" stroke-opacity=".55" />
    <path d="M8 52h48" stroke="#ff2bd6" stroke-opacity=".55" stroke-width="1.5" />
    <text
      x="32"
